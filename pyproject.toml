[build-system]
requires = [
    "setuptools>=43.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "genocide"
description = "Since 4 March 2019"
version = "236"
authors = [
    {name = "Bart Thate", email = "bthate@dds.nl" },
]
readme = "README.rst"
license = "Unlicense"
classifiers = [ 
    'Development Status :: 3 - Alpha',
    'Operating System :: Unix',
    'Programming Language :: Python',
    'Topic :: Utilities'
]


[project.scripts]
"genocide" = "genocide.runtime:main"


[project.urls]
"home" = "https://pypi.org/project/genocide"
"bugs" = "https://github.com/bthate/genocide/issues"
"source" = "https://github.com/bthate/genocide"


[tool.pylint."messages control"]
disable = ["C,R,W,E0401,E0402"]


[tool.ruff.lint]
ignore = ["E402", "E501", "E701", "E702"]


[tool.setuptools]
packages = [
    'genocide',
    'genocide.minimal',
    'genocide.mirrors',
    'genocide.modules',
    'genocide.numbers',
    'genocide.numbers',
    'genocide.numbers.pdf',
    'genocide.numbers._static',
    'genocide.numbers._images'
]
include-package-data = true


[tool.setuptools.package-data]
"genocide.numbers"         = ["*"]
"genocide.numbers.pdf"     = ["*"]
"genocide.numbers._images" = ["*"]
"genocide.numbers._static" = ["*"]
