[build-system]
requires = [
    "setuptools>=43.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "genocide"
description = "Since 4 March 2019"
version = "237"
authors = [
    {name = "Bart Thate", email = "bthate@dds.nl" },
]
readme = "README.rst"
license = "Unlicense"
classifiers = [ 
    'Development Status :: 3 - Alpha',
    'Operating System :: Unix',
    'Programming Language :: Python',
    'Topic :: Utilities'
]


[project.scripts]
"genocide" = "genocide.runtime:main"


[project.urls]
"home" = "https://pypi.org/project/genocide"
"bugs" = "https://github.com/bthate/genocide/issues"
"source" = "https://github.com/bthate/genocide"


[tool.setuptools]
packages = [
    'genocide',
    'genocide.minimal',
    'genocide.modules',
    'genocide.namings',
    'genocide.numbers',
    'genocide.numbers.pdf',
    'genocide.numbers._static',
    'genocide.numbers._images'
]
include-package-data = true


[tool.setuptools.package-data]
"genocide.numbers"         = ["*"]
"genocide.numbers.pdf"     = ["*"]
"genocide.numbers._images" = ["*"]
"genocide.numbers._static" = ["*"]


[tool.pylint."messages control"]
disable = [
    'R',
    'attribute-defined-outside-init',
    'broad-exception-caught',
    'invalid-name',
    'import-outside-toplevel',
    'line-too-long',
    'protected-access',
    'relative-beyond-top-level',
    'unused-argument',
    'wrong-import-position'
]


[tool.ruff.lint]
preview = true
ignore = [
    'DTZ',
    'deprecated-import',
    'blind-except',
    'invalid-all-format',
    'mutable-class-default',
    'non-pep585-annotation',
    'non-pep604-annotation-union',
    'unsorted-imports',
    'verbose-log-message'
]


[tool.mypy]
disable_error_code = [
    'annotation-unchecked',
    'var-annotated'
]
